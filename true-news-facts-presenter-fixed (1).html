  }

* {
  box-sizing: border-box;
}

html, body, #root {
  margin: 0;
  min-width: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
}

button, input, textarea, select {
  font: inherit;
}

button, select, input[type="range"] {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.app-shell {
  min-height: 100vh;
  padding: var(--safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom));
  background: radial-gradient(circle at 50% 0, #183a60 0, var(--bg) 52%);
}

.page {
  width: min(100%, 560px);
  margin: 0 auto;
  padding: 16px 16px 0;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 11px;
  min-height: 62px;
  padding: 4px 2px 13px;
}

.flag-mark {
  width: 30px;
  height: 28px;
  overflow: hidden;
  border: 1px solid #fff;
  flex: 0 0 auto;
}

.flag-mark span {
  display: block;
  height: 9px;
  background: #d92b34;
  border-bottom: 1px solid #fff;
}

.flag-mark span:nth-child(2) {
  background: #fff;
}

.flag-mark span:nth-child(3) {
  background: #274b8d;
}

.topbar h1 {
  margin: 0;
  font-size: clamp(24px, 7vw, 34px);
  line-height: .95;
  letter-spacing: -.04em;
  font-weight: 900;
  text-shadow: 2px 2px 0 var(--red);
}

.topbar p {
  margin: 5px 0 0;
  font-size: 11px;
  letter-spacing: .18em;
  color: #b9c9da;
  font-weight: 800;
}

.topbar p span {
  color: var(--gold);
}

.live-pill {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--red);
  color: white;
  border-radius: 999px;
  padding: 7px 10px;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .12em;
}

.live-pill i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: white;
  animation: blink 1.1s infinite;
}

@keyframes blink {
  50% {
    opacity: .25;
  }
}

.stage {
  position: relative;
  overflow: hidden;
  border-radius: 22px;
  border: 3px solid #e8edf3;
  aspect-ratio: 4 / 4.35;
  background: #0a1729;
  box-shadow: 0 18px 45px rgba(0,0,0,.42);
}

.photo-wrap {
  position: absolute;
  inset: 0;
}

.photo-wrap img {
  width: 100%;
  height: 100%;
  -o-object-fit: cover;
     object-fit: cover;
  -o-object-position: 50% 24%;
     object-position: 50% 24%;
  display: block;
}

.photo-wrap.bobbing {
  animation: bob 1.05s ease-in-out infinite;
}

@keyframes bob {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(3px);
  }
}

.stage-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.52), transparent 38%, transparent 75%, rgba(0,0,0,.1));
}

.status-badge {
  position: absolute;
  z-index: 3;
  top: 14px;
  left: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 11px;
  border-radius: 999px;
  background: rgba(0,0,0,.78);
  color: white;
  border: 1px solid rgba(255,255,255,.28);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .12em;
}

.pulse-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #7ddf89;
}

.status-speaking .pulse-dot {
  background: #ff4646;
  animation: blink .55s infinite;
}

.status-paused .pulse-dot {
  background: #f0c35b;
}

.lower-third {
  position: absolute;
  z-index: 3;
  left: 14px;
  bottom: 14px;
  display: flex;
  flex-direction: column;
}

.lower-third small {
  color: #f0c35b;
  font-size: 10px;
  letter-spacing: .2em;
  font-weight: 900;
}

.lower-third strong {
  font-size: 20px;
  letter-spacing: -.02em;
  text-shadow: 0 2px 6px black;
}

.corner {
  position: absolute;
  width: 23px;
  height: 23px;
  border: 3px solid rgba(255,255,255,.9);
  z-index: 3;
}

.corner-a {
  top: 9px;
  right: 9px;
  border-left: 0;
  border-bottom: 0;
}

.corner-b {
  bottom: 9px;
  right: 9px;
  border-left: 0;
  border-top: 0;
}

/* Mouth overlay centered on lower face. */

.mouth {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 67.5%;
  width: 54px;
  height: 7px;
  transform: translate(-50%, -50%) rotate(-1deg);
  overflow: hidden;
  border-radius: 50%;
  background: #6f2425;
  box-shadow: 0 0 0 2px rgba(43,10,10,.35);
  transition: height .14s ease;
}

.mouth span {
  display: block;
  width: 100%;
  height: 100%;
  background: #371113;
  border-radius: 50%;
}

.mouth.talking {
  animation: talk .34s ease-in-out infinite alternate;
}

@keyframes talk {
  from {
    height: 6px;
    transform: translate(-50%, -50%) scaleX(.94);
  }

  to {
    height: 22px;
    transform: translate(-50%, -50%) scaleX(1.08);
  }
}

.captions {
  margin-top: 12px;
  background: #000;
  color: #fff;
  border: 1px solid #3c556f;
  border-radius: 18px;
  padding: 15px 16px 16px;
  min-height: 136px;
}

.caption-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  color: #f0c35b;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .12em;
}

.caption-head span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.caption-head span:last-child {
  color: #9eb3c8;
  letter-spacing: .04em;
}

.caption-text {
  margin: 14px 0 0;
  font-size: clamp(21px, 6vw, 27px);
  line-height: 1.38;
  font-weight: 750;
}

.caption-text span {
  padding: 1px 2px;
  border-radius: 4px;
}

.active-word {
  background: var(--gold);
  color: #111;
  box-shadow: 0 0 0 3px var(--gold);
}

.dim {
  color: #8da2b5;
  font-size: 18px;
}

.notice {
  color: #ffc8cb;
  font-size: 13px;
  margin: 10px 0 0;
}

.card {
  margin-top: 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 10px 28px rgba(0,0,0,.18);
}

.script-card label, .voice-row > label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 900;
}

textarea {
  width: 100%;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #07182e;
  color: white;
  padding: 13px;
  line-height: 1.55;
  resize: vertical;
  min-height: 124px;
  outline: none;
}

textarea:focus, select:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(47,120,214,.28);
}

.script-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 12px;
}

.script-meta button {
  border: 0;
  background: transparent;
  color: #8fc1ff;
  font-weight: 800;
  padding: 6px 0;
}

.voice-row > p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin: 8px 0 0;
}

.select-wrap {
  position: relative;
  margin-top: 11px;
}

.select-wrap svg {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: white;
}

select {
  width: 100%;
  -webkit-appearance: none;
     -moz-appearance: none;
          appearance: none;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #07182e;
  color: white;
  padding: 14px 38px 14px 13px;
  font-weight: 700;
}

.sliders {
  display: grid;
  gap: 18px;
  margin-top: 22px;
}

.slider-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 9px;
}

.slider-label span {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 850;
}

.slider-label b {
  color: var(--gold);
}

input[type="range"] {
  width: 100%;
  accent-color: var(--red);
  height: 28px;
}

.range-labels {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11px;
  margin-top: -2px;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 21px;
}

.buttons button {
  min-height: 54px;
  border: 0;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 900;
  font-size: 16px;
}

.play {
  background: var(--red);
  color: white;
  box-shadow: 0 5px 0 #78161b;
}

.pause {
  background: white;
  color: #0c223d;
}

.stop {
  grid-column: 1 / -1;
  background: #1a3552;
  color: white;
  border: 1px solid var(--line);
}

.buttons button:active {
  transform: translateY(2px);
}

.how-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #8fc1ff;
}

.how-title h2 {
  margin: 0;
  font-size: 19px;
  color: white;
}

.how ol {
  list-style: none;
  margin: 17px 0 0;
  padding: 0;
  display: grid;
  gap: 13px;
}

.how li {
  display: flex;
  gap: 12px;
  align-items: center;
}

.how li > b {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--red);
}

.how li span {
  display: flex;
  flex-direction: column;
}

.how li strong {
  font-size: 15px;
}

.how li small {
  color: var(--muted);
  margin-top: 2px;
}

.embedded-note {
  margin: 17px 0 0;
  padding: 13px;
  border-radius: 12px;
  background: rgba(240,195,91,.13);
  color: #f4d98d;
  font-size: 13px;
  line-height: 1.55;
}

footer {
  padding: 18px 4px 8px;
  text-align: center;
  color: #74899f;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .14em;
}

@media (min-width: 620px) {
  .page {
    padding-top: 22px;
  }

  .sliders {
    grid-template-columns: 1fr 1fr;
  }

  .buttons {
    grid-template-columns: 1.15fr 1fr .8fr;
  }

  .stop {
    grid-column: auto;
  }
}

@media (prefers-reduced-motion: reduce) {
  .photo-wrap.bobbing, .mouth.talking, .live-pill i, .pulse-dot {
    animation: none !important;
  }
}
